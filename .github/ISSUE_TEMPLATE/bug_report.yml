name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in the project.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Detailed bug reports help us fix issues faster.

        **Before submitting:**
        - Search existing issues to avoid duplicates
        - Verify the issue is reproducible with the latest version
        - Isolate the problem (provide minimal steps to reproduce)

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Your operating system and version.
      placeholder: "Windows 11, macOS 14.2, Ubuntu 22.04 LTS"
    validations:
      required: true

  - type: input
    id: installation_method
    attributes:
      label: Setup Method
      description: How did you set up ScriptHub? (for example `cargo run`, devcontainer, or local manual setup)
      placeholder: "cargo run, devcontainer, local Rust toolchain"
    validations:
      required: true

  - type: input
    id: environment_info
    attributes:
      label: Environment Details (Optional)
      description: Rust version, terminal environment, or other details that might affect the issue.
      placeholder: "rustc 1.xx, Ubuntu 24.04, tmux, Wayland"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, numbered steps to reproduce the issue. Be as specific as possible.
      placeholder: |
        1. Step 1
        2. Step 2
        3. Step 3
        4. Step 4
        5. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead? Be clear and concise.
      placeholder: "ScriptHub should list the matching script and show the command preview."
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Describe the bug clearly and concisely.
      placeholder: "ScriptHub exits early, shows the wrong command, or fails to discover a script."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Paste complete error logs, full stack traces, or screenshots. Use code blocks for readability.
      placeholder: |
        ```
        Put your log in here
        ```

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if available)
      description: If you've found a way to work around this issue, please describe it.
      placeholder: "As a workaround, I can set the timeout environment variable before starting the app."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Verification Checklist
      options:
        - label: I've verified this bug hasn't been reported before
          required: true
        - label: I can reproduce this issue consistently
          required: true
        - label: I've included all relevant logs, screenshots, and error messages
          required: true
        - label: I've tested with the latest version of the project
          required: false
