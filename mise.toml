[tools]
prek = "latest"
rumdl = "latest"
rust = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh" }

[env]
_.file = ".env"  # for sensitive data
MISE_RUSTUP_HOME = "{{env.HOME}}/.local/share/rustup"
MISE_CARGO_HOME = "{{env.HOME}}/.local/share/cargo"

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"
